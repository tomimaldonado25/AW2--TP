<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Electromon — Panel de Administración</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:     #6c63ff;
      --primary-dk:  #574fd6;
      --danger:      #e05c72;
      --danger-dk:   #c0435a;
      --success:     #4caf84;
      --warn:        #f0a500;
      --bg:          #0f0f1a;
      --surface:     #1a1a2e;
      --surface2:    #22223b;
      --border:      #2e2e4a;
      --text:        #e8e8f0;
      --text-muted:  #888aa0;
      --radius:      12px;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .admin-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .admin-header .brand { display: flex; align-items: center; gap: .75rem; }
    .admin-header .pill {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #ff6584);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: .85rem; color: #fff;
    }
    .admin-header h1 { font-size: 1.1rem; font-weight: 600; }
    .admin-header p  { font-size: .75rem; color: var(--text-muted); }
    .admin-header a {
      color: var(--primary); font-size: .85rem; text-decoration: none;
      border: 1px solid var(--primary); border-radius: 8px;
      padding: .4rem .9rem; transition: all .2s;
    }
    .admin-header a:hover { background: var(--primary); color: #fff; }

  
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }

    #toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: var(--success); color: #fff;
      padding: .75rem 1.25rem; border-radius: 10px;
      font-size: .9rem; font-weight: 500;
      opacity: 0; transform: translateY(10px);
      transition: all .3s; pointer-events: none; z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.error { background: var(--danger); }

    .stats { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .stat-card {
      flex: 1; min-width: 140px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.2rem 1.5rem;
    }
    .stat-card .label { font-size: .75rem; color: var(--text-muted); margin-bottom: .3rem; }
    .stat-card .value { font-size: 1.8rem; font-weight: 700; color: var(--primary); }

    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    .section-header h2 { font-size: 1.1rem; font-weight: 600; }


    .form-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.75rem;
      margin-bottom: 2.5rem;
    }
    .form-card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1.25rem; color: var(--primary); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: .4rem; }
    .form-group label { font-size: .8rem; color: var(--text-muted); font-weight: 500; }
    .form-group input {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: .6rem .9rem;
      color: var(--text); font-family: inherit; font-size: .9rem;
      outline: none; transition: border-color .2s;
    }
    .form-group input:focus { border-color: var(--primary); }
    .form-group input::placeholder { color: var(--text-muted); }
    .form-actions { display: flex; gap: .75rem; margin-top: 1.25rem; }

    .btn {
      padding: .6rem 1.3rem; border-radius: 8px; border: none;
      font-family: inherit; font-size: .875rem; font-weight: 600;
      cursor: pointer; transition: all .2s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dk); transform: translateY(-1px); }
    .btn-ghost {
      background: transparent; color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--text-muted); color: var(--text); }
    .btn-edit {
      background: transparent; color: var(--warn);
      border: 1px solid var(--warn); font-size: .78rem; padding: .35rem .75rem;
    }
    .btn-edit:hover { background: var(--warn); color: var(--bg); }
    .btn-delete {
      background: transparent; color: var(--danger);
      border: 1px solid var(--danger); font-size: .78rem; padding: .35rem .75rem;
    }
    .btn-delete:hover { background: var(--danger); color: #fff; }

    .table-wrap {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--surface2); }
    thead th {
      text-align: left; padding: .9rem 1.25rem;
      font-size: .8rem; color: var(--text-muted); font-weight: 600;
      letter-spacing: .05em; text-transform: uppercase;
    }
    tbody tr { border-top: 1px solid var(--border); transition: background .15s; }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: .85rem 1.25rem; font-size: .875rem; }
    .td-id   { color: var(--text-muted); font-size: .8rem; }
    .td-tipo span {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: .2rem .7rem; font-size: .75rem;
    }
    .td-actions { display: flex; gap: .5rem; }
    .td-empty {
      text-align: center; padding: 3rem; color: var(--text-muted); font-size: .9rem;
    }


    .loader-wrap { text-align: center; padding: 3rem; color: var(--text-muted); }

    @media (max-width: 640px) {
      .form-grid { grid-template-columns: 1fr; }
      .stats { flex-direction: column; }
    }
  </style>
</head>
<body>

  <header class="admin-header">
    <div class="brand">
      <div class="pill">PA</div>
      <div>
        <h1>Electromon — Admin</h1>
        <p>Panel de administración de productos</p>
      </div>
    </div>
    <a href="/catalogo.html">← Ver tienda</a>
  </header>

  <div class="container">

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="label">Total productos</div>
        <div class="value" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Precio promedio</div>
        <div class="value" id="stat-avg">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Precio más alto</div>
        <div class="value" id="stat-max">—</div>
      </div>
    </div>

    <div class="form-card">
      <h2 id="form-title">➕ Nuevo producto</h2>
      <div class="form-grid">
        <div class="form-group">
          <label for="input-nombre">Nombre *</label>
          <input type="text" id="input-nombre" placeholder="Ej: Pikachu" />
        </div>
        <div class="form-group">
          <label for="input-precio">Precio (ARS) *</label>
          <input type="number" id="input-precio" placeholder="Ej: 8750" min="0" step="0.01" />
        </div>
        <div class="form-group">
          <label for="input-tipo">Tipo</label>
          <input type="text" id="input-tipo" placeholder="Ej: electric, fire, water..." />
        </div>
        <div class="form-group">
          <label for="input-imagen">Nombre de imagen</label>
          <input type="text" id="input-imagen" placeholder="Ej: pikachu.png" />
        </div>
      </div>
      <input type="hidden" id="editing-id" value="" />
      <div class="form-actions">
        <button class="btn btn-primary" onclick="guardarProducto()">Guardar producto</button>
        <button class="btn btn-ghost" onclick="cancelarEdicion()">Cancelar</button>
      </div>
    </div>

    <div class="section-header">
      <h2>Productos en la base de datos</h2>
      <button class="btn btn-ghost" onclick="cargarProductos()">↻ Actualizar</button>
    </div>

    <div class="table-wrap">
      <div id="loader" class="loader-wrap">Cargando productos...</div>
      <table id="tabla" style="display:none;">
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Tipo</th>
            <th>Imagen</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

  </div>

  <div id="toast"></div>

  <script>
    const API = '/api/v1/productos'

    async function cargarProductos() {
      const loader = document.getElementById('loader')
      const tabla  = document.getElementById('tabla')
      const tbody  = document.getElementById('tbody')

      loader.style.display = 'block'
      tabla.style.display  = 'none'

      try {
        const res = await fetch(API)
        if (!res.ok) throw new Error('Error al cargar')
        const productos = await res.json()

        document.getElementById('stat-total').textContent = productos.length
        if (productos.length > 0) {
          const precios = productos.map(p => Number(p.precio))
          const avg = precios.reduce((a, b) => a + b, 0) / precios.length
          document.getElementById('stat-avg').textContent = '$ ' + Math.round(avg).toLocaleString('es-AR')
          document.getElementById('stat-max').textContent = '$ ' + Math.max(...precios).toLocaleString('es-AR')
        }

        tbody.innerHTML = ''

        if (productos.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="td-empty">No hay productos aún. ¡Agregá el primero!</td></tr>`
        } else {
          productos.forEach(p => {
            const tr = document.createElement('tr')
            tr.innerHTML = `
              <td class="td-id">${p.id}</td>
              <td><strong>${capitalizar(p.nombre)}</strong></td>
              <td>$ ${Number(p.precio).toLocaleString('es-AR')}</td>
              <td class="td-tipo">${p.tipo ? `<span>${p.tipo}</span>` : '<span style="opacity:.4">—</span>'}</td>
              <td style="color:var(--text-muted);font-size:.8rem">${p.imagen || '—'}</td>
              <td class="td-actions">
                <button class="btn btn-edit" onclick="editarProducto(${p.id})">Editar</button>
                <button class="btn btn-delete" onclick="eliminarProducto(${p.id}, '${capitalizar(p.nombre)}')">Eliminar</button>
              </td>`
            tbody.appendChild(tr)
          })
        }

        loader.style.display = 'none'
        tabla.style.display  = 'table'
      } catch (err) {
        console.error(err)
        loader.innerHTML = '<p style="color:var(--danger)">Error al cargar productos. ¿Está el servidor corriendo?</p>'
      }
    }

    async function guardarProducto() {
      const id     = document.getElementById('editing-id').value
      const nombre = document.getElementById('input-nombre').value.trim()
      const precio = document.getElementById('input-precio').value
      const tipo   = document.getElementById('input-tipo').value.trim()
      const imagen = document.getElementById('input-imagen').value.trim()

      if (!nombre || !precio) {
        showToast('Nombre y precio son obligatorios', true)
        return
      }

      const body = { nombre, precio: Number(precio), tipo: tipo || null, imagen: imagen || null }

      try {
        let res
        if (id) {
          res = await fetch(`${API}/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        } else {
          res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        }

        if (!res.ok) {
          const data = await res.json()
          throw new Error(data.error || 'Error al guardar')
        }

        showToast(id ? '✓ Producto modificado' : '✓ Producto agregado')
        cancelarEdicion()
        cargarProductos()
      } catch (err) {
        showToast(err.message, true)
      }
    }

    async function editarProducto(id) {
      try {
        const res = await fetch(`${API}/${id}`)
        if (!res.ok) throw new Error('No encontrado')
        const p = await res.json()

        document.getElementById('editing-id').value  = p.id
        document.getElementById('input-nombre').value = p.nombre
        document.getElementById('input-precio').value = p.precio
        document.getElementById('input-tipo').value   = p.tipo   || ''
        document.getElementById('input-imagen').value = p.imagen || ''
        document.getElementById('form-title').textContent = `✏️ Editando: ${capitalizar(p.nombre)}`

        window.scrollTo({ top: 0, behavior: 'smooth' })
      } catch (err) {
        showToast('Error al cargar el producto', true)
      }
    }

    async function eliminarProducto(id, nombre) {
      if (!confirm(`¿Eliminár "${nombre}"? Esta acción no se puede deshacer.`)) return
      try {
        const res = await fetch(`${API}/${id}`, { method: 'DELETE' })
        if (!res.ok) throw new Error('Error al eliminar')
        showToast(`✓ "${nombre}" eliminado`)
        cargarProductos()
      } catch (err) {
        showToast(err.message, true)
      }
    }

    function cancelarEdicion() {
      document.getElementById('editing-id').value  = ''
      document.getElementById('input-nombre').value = ''
      document.getElementById('input-precio').value = ''
      document.getElementById('input-tipo').value   = ''
      document.getElementById('input-imagen').value = ''
      document.getElementById('form-title').textContent = '➕ Nuevo producto'
    }

    
    function showToast(msg, isError = false) {
      const t = document.getElementById('toast')
      t.textContent = msg
      t.className = 'show' + (isError ? ' error' : '')
      setTimeout(() => { t.className = '' }, 3000)
    }

    function capitalizar(str) {
      if (!str) return ''
      return str.charAt(0).toUpperCase() + str.slice(1)
    }

    cargarProductos()
  </script>
</body>
</html>
