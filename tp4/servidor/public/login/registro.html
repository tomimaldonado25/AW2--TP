<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Electromon — Registro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0f0f1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e8e8f0;
    }

    .login-box {
      background: #1a1a2e;
      border: 1px solid #2e2e4a;
      border-radius: 14px;
      padding: 2.5rem;
      width: 100%;
      max-width: 360px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 1.75rem;
    }
    .brand .pill {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(135deg, #6c63ff, #ff6584);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: .85rem; color: #fff;
    }
    .brand h1 { font-size: 1.05rem; font-weight: 600; }
    .brand p { font-size: .75rem; color: #888aa0; }

    form { display: flex; flex-direction: column; gap: 1rem; }

    label { font-size: .8rem; color: #888aa0; font-weight: 500; display: block; margin-bottom: .35rem; }

    input {
      width: 100%;
      background: #0f0f1a;
      border: 1px solid #2e2e4a;
      border-radius: 8px;
      padding: .65rem .9rem;
      color: #e8e8f0;
      font-family: inherit;
      font-size: .9rem;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: #6c63ff; }

    button {
      margin-top: .5rem;
      background: #4caf84;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: .75rem;
      font-family: inherit;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #3d9c70; }

    .footer-link {
      text-align: center;
      margin-top: 1.25rem;
      font-size: .82rem;
      color: #888aa0;
    }
    .footer-link a { color: #6c63ff; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }

    #mensaje {
      display: none;
      padding: .6rem .8rem;
      border-radius: 8px;
      font-size: .82rem;
      margin-bottom: .5rem;
    }
    #mensaje.error { background: #e05c72; color: #fff; }
    #mensaje.ok { background: #4caf84; color: #fff; }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="brand">
      <div class="pill">PA</div>
      <div>
        <h1>Electromon</h1>
        <p>Crear cuenta de administrador</p>
      </div>
    </div>

    <div id="mensaje"></div>

    <form id="form-registro">
      <div>
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" required autocomplete="username" />
      </div>
      <div>
        <label for="pass">Contraseña</label>
        <input type="password" id="pass" name="pass" required autocomplete="new-password" minlength="6" />
      </div>
      <button type="submit">Registrarme</button>
    </form>

    <div class="footer-link">
      ¿Ya tenés cuenta? <a href="/login">Iniciar sesión</a>
    </div>
  </div>

  <script>
    document.getElementById('form-registro').addEventListener('submit', async (e) => {
      e.preventDefault()
      const usuario = document.getElementById('usuario').value
      const pass = document.getElementById('pass').value
      const mensaje = document.getElementById('mensaje')
      const boton = e.target.querySelector('button')

      mensaje.style.display = 'none'
      boton.disabled = true
      boton.textContent = 'Registrando...'

      try {
        const res = await fetch('/registrar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, pass })
        })

        const data = await res.json()

        if (res.ok) {
          mensaje.className = 'ok'
          mensaje.textContent = '¡Cuenta creada! Redirigiendo al login...'
          mensaje.style.display = 'block'
          setTimeout(() => { window.location.href = '/login' }, 900)
        } else {
          mensaje.textContent = data.error || 'Error al registrarse'
          mensaje.className = 'error'
          mensaje.style.display = 'block'
          boton.disabled = false
          boton.textContent = 'Registrarme'
        }
      } catch (err) {
        mensaje.textContent = 'Error de conexión con el servidor'
        mensaje.className = 'error'
        mensaje.style.display = 'block'
        boton.disabled = false
        boton.textContent = 'Registrarme'
      }
    })
  </script>
</body>
</html>
